name: CI/CD - GitHub Pages

on:
  push:
    branches: [main]

jobs:
  first-deploy:
    name: Desplegar en GitHub Pages
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Print variable
        run: echo "${{ secrets.TOKEN_SECRET }}"

      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install dependencies
        run: npm install
      