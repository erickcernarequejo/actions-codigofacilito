name: "Deploy Codigo Facilito"

on:
  push:
    branches:
      - main

jobs:
  first_job:
    name: "Primer Job"
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: production

    steps:
      - name: Working Directory
        id: step_1
        run: echo "my_variable=Hola Mundo" >> $GITHUB_OUTPUT
      
      - name: Obtener mensaje de la variable
        run: echo "El mensaje es ${{ steps.step_1.outputs.my_variable }}"
  
  second_job:
    needs: first_job
    runs-on: ubuntu-latest

    steps:
      - name: Hola Mundo 2
        run: echo "Hola Mundo 2 ${{ github.ref }}"
