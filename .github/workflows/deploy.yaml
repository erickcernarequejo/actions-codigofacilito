name: "Deploy Codigo Facilito"

on:
  push:
    branches:
      - main

jobs:
  first_job:
    name: "Primer Job"
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: production

    steps:
      - name: Hola Mundo
        run: echo "Hola Mundo ${{ env.ENVIRONMENT }}"
  
  second_job:
    needs: first_job
    runs-on: ubuntu-latest

    steps:
      - name: Hola Mundo 2
        run: echo "Hola Mundo 2 ${{ github.ref }}"
