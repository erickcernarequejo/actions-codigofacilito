name: "Deploy Codigo Facilito"

on:
  push:
    branches:
      - main

jobs:
  first_job:
    name: "Primer Job"
    runs-on: ubuntu-latest

    outputs:
      salida_variable: ${{ steps.step_1.outputs.my_variable }}

    steps:
      - name: Generar archivo
        run: |
          echo "Hola Mundo" >> test.log

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: archivo-test
          path: test.log
        
